[project]
name = "flyfault"
version = "0.1.0"
description = "A causal lesion laboratory for an embodied virtual fly"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "flygym==2.1.1",
    "brian2==2.9.0",
    "mujoco>=3.16,<3.17",
    "numpy==2.2.6",
    "matplotlib>=3.10,<4",
    "plotly>=6,<7",
    "streamlit>=1.51,<2",
    "imageio>=2.37,<3",
    "imageio-ffmpeg>=0.6,<1",
    "pillow>=12,<13",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[build-system]
requires = ["hatchling==1.30.0"]
build-backend = "hatchling.build"

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".tooling", "results", "media"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
